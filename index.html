<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graph Paper Tic-Tac-Toe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: a single sheet of graph paper; pencil grid in the middle, tally score in the margin above. */
  :root {
    --paper: #f7f8f4;
    --grid: #d5e0ea;
    --margin-line: #e4a3a3;
    --graphite: #2e3338;
    --x-ink: #2a59a8;
    --o-ink: #b8462f;
    --muted: #6d7680;
    --win: #e8c24a;
    --font-hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #142235; --grid: #22374f; --margin-line: #7a4250;
      --graphite: #e3ecf5; --x-ink: #8cc0ff; --o-ink: #ff9f86;
      --muted: #8ea2b8; --win: #e8c24a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #142235; --grid: #22374f; --margin-line: #7a4250;
    --graphite: #e3ecf5; --x-ink: #8cc0ff; --o-ink: #ff9f86;
    --muted: #8ea2b8; --win: #e8c24a; color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--graphite);
    font-family: var(--font-hand);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
  }
  main {
    max-width: 460px;
    margin: 0 auto;
    display: grid;
    gap: 20px;
  }
  header { display: grid; gap: 4px; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 2.6rem);
    line-height: 1.05;
    font-weight: 700;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); font-size: 1.05rem; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg {
    display: inline-flex;
    border: 2px solid var(--graphite);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    overflow: hidden;
  }
  .seg button {
    font: inherit; font-size: 1rem;
    background: transparent; color: var(--graphite);
    border: 0; padding: 4px 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--graphite); color: var(--paper); }
  .seg button + button { border-left: 2px solid var(--graphite); }

  .score {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 2px solid var(--margin-line);
    border-bottom: 2px solid var(--margin-line);
    padding-block: 8px;
    text-align: center;
  }
  .score div { display: grid; gap: 2px; }
  .score .label {
    font-family: var(--font-mono); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .score .val {
    font-family: var(--font-mono); font-weight: 600; font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
  }
  .score .x .val { color: var(--x-ink); }
  .score .o .val { color: var(--o-ink); }

  .status {
    margin: 0; min-height: 1.6em;
    font-size: 1.4rem; text-align: center;
  }
  .status .x { color: var(--x-ink); font-weight: 700; }
  .status .o { color: var(--o-ink); font-weight: 700; }

  .board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; }
  .board {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }
  .grid-lines, .strike {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .grid-lines path {
    fill: none; stroke: var(--graphite); stroke-width: 2.2;
    stroke-linecap: round; opacity: 0.85;
  }
  .cell {
    background: transparent; border: 0; padding: 14%;
    cursor: pointer; color: inherit;
    display: grid; place-items: stretch;
    border-radius: 12px;
  }
  .cell:disabled { cursor: default; }
  .cell:focus-visible { outline: 3px dashed var(--muted); outline-offset: -8px; }
  .cell:not(:disabled):hover .ghost { opacity: 0.18; }
  .cell svg { width: 100%; height: 100%; overflow: visible; }
  .cell path {
    fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
  }
  .cell .mark-x path { stroke: var(--x-ink); }
  .cell .mark-o path { stroke: var(--o-ink); }
  .ghost { opacity: 0; transition: opacity 120ms; }
  .draw path {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw 260ms ease-out forwards;
  }
  .draw path:nth-child(2) { animation-delay: 160ms; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .strike path {
    fill: none; stroke: var(--win); stroke-width: 10; stroke-linecap: round;
    opacity: 0.85; mix-blend-mode: multiply;
  }
  :root[data-theme="dark"] .strike path { mix-blend-mode: normal; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .strike path { mix-blend-mode: normal; } }
  .strike.show path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 420ms ease-out forwards; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    font: inherit; font-size: 1.15rem; font-weight: 700;
    color: var(--paper); background: var(--graphite);
    border: 0; padding: 8px 22px; cursor: pointer;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }
  .btn.ghost-btn { background: transparent; color: var(--graphite); border: 2px solid var(--graphite); }
  .btn:focus-visible, .seg button:focus-visible { outline: 3px dashed var(--muted); outline-offset: 3px; }
  .hint { margin: 0; text-align: center; color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; }

  @media (prefers-reduced-motion: reduce) {
    .draw path, .strike.show path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>Tic-Tac-Toe</h1>
    <p class="sub">Three in a row on a sheet of graph paper.</p>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Opponent">
      <button type="button" id="mode-cpu" data-mode="cpu" aria-pressed="true">vs Computer</button>
      <button type="button" id="mode-pvp" data-mode="pvp" aria-pressed="false">2 Players</button>
    </div>
    <div class="seg" role="group" aria-label="Computer difficulty" id="diff-group">
      <button type="button" id="diff-easy" data-diff="easy" aria-pressed="false">Easy</button>
      <button type="button" id="diff-hard" data-diff="hard" aria-pressed="true">Unbeatable</button>
    </div>
  </div>

  <section class="score" aria-label="Score">
    <div class="x"><span class="label" id="x-label">You (X)</span><span class="val" id="score-x">0</span></div>
    <div><span class="label">Draws</span><span class="val" id="score-d">0</span></div>
    <div class="o"><span class="label" id="o-label">Computer (O)</span><span class="val" id="score-o">0</span></div>
  </section>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="board-wrap">
    <svg class="grid-lines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
      <path d="M101 6 C99 80 103 200 99 294" />
      <path d="M199 8 C201 90 197 210 201 292" />
      <path d="M6 99 C90 102 210 97 294 101" />
      <path d="M8 201 C80 198 220 203 292 199" />
    </svg>
    <div class="board" id="board" role="grid" aria-label="Game board"></div>
    <svg class="strike" id="strike" viewBox="0 0 300 300" aria-hidden="true"><path d="" /></svg>
  </div>

  <div class="actions">
    <button type="button" class="btn" id="new-round">New round</button>
    <button type="button" class="btn ghost-btn" id="reset">Reset score</button>
  </div>
  <p class="hint">Keys 1–9 play a square (numpad layout) · N starts a new round</p>
</main>

<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const X_PATHS = ['M14 14 C38 40 62 62 86 86', 'M86 14 C62 38 40 62 14 86'];
  const O_PATH = 'M50 12 C76 11 89 30 88 51 C87 74 70 89 49 88 C26 87 11 70 12 49 C13 28 28 13 54 14';

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board'), statusEl = $('status'), strikeEl = $('strike');

  let state = {
    board: Array(9).fill(null),
    turn: 'X',
    starter: 'X',
    mode: 'cpu',
    diff: 'hard',
    score: { X: 0, O: 0, D: 0 },
    over: false,
    winLine: null,
  };
  let cpuTimer = null;
  const animated = new Set();

  function winnerOf(b) {
    for (const line of LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line };
    }
    return b.every(Boolean) ? { player: null, line: null } : null;
  }

  // Minimax with depth so the computer wins fastest and loses slowest.
  function minimax(b, player, depth) {
    const res = winnerOf(b);
    if (res) return { score: res.player === 'O' ? 10 - depth : res.player === 'X' ? depth - 10 : 0 };
    let best = { score: player === 'O' ? -Infinity : Infinity, move: -1 };
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = player;
      const { score } = minimax(b, player === 'O' ? 'X' : 'O', depth + 1);
      b[i] = null;
      if (player === 'O' ? score > best.score : score < best.score) best = { score, move: i };
    }
    return best;
  }

  function cpuMove() {
    const empty = state.board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (state.diff === 'easy' && Math.random() < 0.6) {
      return empty[Math.floor(Math.random() * empty.length)];
    }
    if (empty.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
    return minimax(state.board.slice(), 'O', 0).move;
  }

  function play(i) {
    if (state.over || state.board[i]) return;
    state.board[i] = state.turn;
    const res = winnerOf(state.board);
    if (res) {
      state.over = true;
      state.winLine = res.line;
      state.score[res.player || 'D']++;
    } else {
      state.turn = state.turn === 'X' ? 'O' : 'X';
    }
    render();
    maybeCpu();
  }

  function maybeCpu() {
    clearTimeout(cpuTimer);
    if (state.mode === 'cpu' && state.turn === 'O' && !state.over) {
      cpuTimer = setTimeout(() => play(cpuMove()), 420);
    }
  }

  function newRound() {
    clearTimeout(cpuTimer);
    state.starter = state.starter === 'X' ? 'O' : 'X';
    state.board = Array(9).fill(null);
    state.turn = state.starter;
    state.over = false;
    state.winLine = null;
    animated.clear();
    render();
    maybeCpu();
  }

  function markSvg(p, draw) {
    const cls = `mark-${p.toLowerCase()}${draw ? ' draw' : ''}`;
    const paths = p === 'X'
      ? X_PATHS.map(d => `<path d="${d}" style="--len:110"/>`).join('')
      : `<path d="${O_PATH}" style="--len:260"/>`;
    return `<svg viewBox="0 0 100 100" class="${cls}" aria-hidden="true">${paths}</svg>`;
  }

  function names() {
    return state.mode === 'cpu'
      ? { X: 'You', O: 'Computer' }
      : { X: 'Player X', O: 'Player O' };
  }

  function render() {
    const n = names();
    const humanTurn = !(state.mode === 'cpu' && state.turn === 'O');
    boardEl.innerHTML = '';
    state.board.forEach((v, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.id = `cell-${i}`;
      btn.setAttribute('role', 'gridcell');
      const row = Math.floor(i / 3) + 1, col = (i % 3) + 1;
      btn.setAttribute('aria-label', `Row ${row}, column ${col}: ${v || 'empty'}`);
      btn.disabled = !!v || state.over || !humanTurn;
      if (v) {
        btn.innerHTML = markSvg(v, !animated.has(i));
        animated.add(i);
      } else if (!state.over && humanTurn) {
        btn.innerHTML = `<span class="ghost">${markSvg(state.turn, false)}</span>`;
      }
      btn.addEventListener('click', () => play(i));
      boardEl.appendChild(btn);
    });

    const res = state.over ? winnerOf(state.board) : null;
    if (res && res.player) {
      const who = n[res.player];
      statusEl.innerHTML = `<span class="${res.player.toLowerCase()}">${who}</span> ${who === 'You' ? 'win' : 'wins'}!`;
    } else if (res) {
      statusEl.textContent = 'Draw. Nobody gets three.';
    } else {
      const t = state.turn;
      statusEl.innerHTML = state.mode === 'cpu' && t === 'O'
        ? `<span class="o">Computer</span> is thinking…`
        : `<span class="${t.toLowerCase()}">${n[t]}</span> ${n[t] === 'You' ? 'are' : 'is'} up (${t})`;
    }

    const path = strikeEl.querySelector('path');
    if (state.winLine) {
      const c = (k) => [(k % 3) * 100 + 50, Math.floor(k / 3) * 100 + 50];
      const [a, b] = [c(state.winLine[0]), c(state.winLine[2])];
      const dx = Math.sign(b[0] - a[0]) * 34, dy = Math.sign(b[1] - a[1]) * 34;
      path.setAttribute('d', `M${a[0] - dx} ${a[1] - dy} L${b[0] + dx} ${b[1] + dy}`);
      if (!strikeEl.classList.contains('show')) strikeEl.classList.add('show');
    } else {
      path.setAttribute('d', '');
      strikeEl.classList.remove('show');
    }

    $('score-x').textContent = state.score.X;
    $('score-o').textContent = state.score.O;
    $('score-d').textContent = state.score.D;
    $('x-label').textContent = `${n.X} (X)`;
    $('o-label').textContent = `${n.O} (O)`;

    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
    document.querySelectorAll('[data-diff]').forEach(b => b.setAttribute('aria-pressed', b.dataset.diff === state.diff));
    $('diff-group').hidden = state.mode !== 'cpu';
  }

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode;
    state.score = { X: 0, O: 0, D: 0 };
    state.starter = 'O';
    newRound();
  }));
  document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => {
    state.diff = b.dataset.diff;
    render();
  }));
  $('new-round').addEventListener('click', newRound);
  $('reset').addEventListener('click', () => {
    state.score = { X: 0, O: 0, D: 0 };
    state.starter = 'O';
    newRound();
  });

  // Numpad layout: 7-8-9 top row, 1-2-3 bottom row.
  const KEYMAP = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8 };
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key in KEYMAP) {
      if (state.mode === 'cpu' && state.turn === 'O') return;
      play(KEYMAP[e.key]);
    } else if (e.key === 'n' || e.key === 'N') {
      newRound();
    }
  });

  function start(saved) {
    if (saved && saved.board) {
      state = { ...state, ...saved };
      state.board.forEach((v, i) => v && animated.add(i));
    }
    render();
    maybeCpu();
  }
  window.claude?.hot?.snapshot?.(() => state);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
